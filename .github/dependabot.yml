version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, individual PRs for anything that needs
      # thought. A single-maintainer repo drowns in per-package updates.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Pinned deliberately — see the React/Next version in package.json.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Held on 6.0.x until typescript-eslint (via eslint-config-next)
      # supports 7; its peer range stops at <6.1.0 and lint refuses to run.
      - dependency-name: typescript
        update-types:
          [version-update:semver-major, version-update:semver-minor]
      # Held on 9 until eslint-plugin-react and eslint-plugin-import (via
      # eslint-config-next) support 10; react crashes on the removed
      # context.getFilename().
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/infra"
    schedule:
      interval: weekly
