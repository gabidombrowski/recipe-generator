# Deploys to the app server the same way the other Next.js app on that host
# does: build the standalone output, copy the static assets into it, rsync it
# over, restart under pm2. It uses the same four secret names, so the values can
# be copied straight across from that repo:
#
#   SERVER_HOST     the server's hostname
#   SERVER_USER     the SSH user
#   SERVER_SSH_KEY  the private key that user accepts
#   APP_PATH        absolute path of the app directory on the server
#
# Plus this app's own runtime secrets, which pm2 reads from the server's .env:
#   AUTH_SECRET, AUTH_GITHUB_ID, AUTH_GITHUB_SECRET, ALLOWED_GITHUB_ID,
#   ANTHROPIC_API_KEY, DB_PATH, TZ, AUTH_URL
#
# A GHCR image is published alongside it for the container path in
# docker-compose.yml. The rsync + pm2 job is the one that actually serves
# traffic today.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sundays 07:00 UTC, the morning each plan week starts: the demo's
    # fixtures are re-recorded at build time, so without this they would
    # freeze at the date of the last push. Only the demo job runs on the
    # schedule — restarting the real app weekly for no code change would be
    # pure risk.
    - cron: "0 7 * * 0"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and deploy over SSH
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds, then completes the standalone output with the static assets,
      # migrations and prompts it deliberately omits. The same script the
      # smoke tests run, so what ships is what was tested.
      - name: Build
        run: npm run build:standalone
        env:
          # Build-time only. The running app reads the real values from the
          # server's environment, which is why pm2 is restarted with
          # --update-env below.
          AUTH_SECRET: build-time-placeholder
          # Repository variable, so no deployment URL is committed. Set it to
          # a leading-slash path to serve under a sub-path of another site;
          # leave it unset for the root. It belongs here rather than on the
          # server because Next bakes it into every asset URL at build time.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Deploy over rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # No --delete: the SQLite database lives inside APP_PATH's data
          # directory, and deleting it would be an unrecoverable data loss on
          # every deploy.
          switches: -az --omit-dir-times --no-perms --exclude 'data/'
          path: .next/standalone/
          remote_path: ${{ secrets.APP_PATH }}
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
          remote_port: 22

      - name: Restart and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}"

            # Load the server's own environment before touching pm2.
            # `--update-env` below replaces the process environment with this
            # shell's — so without this the app would come back from every
            # deploy with no database path, no auth secret and no API key.
            # The file is chmod 600 on the server and never in the repo.
            set -a
            [ -f .env ] && . ./.env
            set +a

            # Back up the SQLite file before the new code touches it. `.backup`
            # is safe against a live connection in a way that `cp` is not.
            if [ -f "${DB_PATH:-data/nutrition.db}" ]; then
              sqlite3 "${DB_PATH:-data/nutrition.db}" ".backup 'data/pre-deploy.db'" || true
            fi

            # Migrations run on boot from instrumentation.ts, before the first
            # request is served — so restarting is the migration step.
            pm2 restart recipe-generator --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            # Fail the deploy if the app does not come back healthy. The probe
            # has to carry BASE_PATH too — under a sub-path the app serves
            # nothing at bare /healthz, and the deploy would fail on a healthy
            # app.
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${PORT:-3200}${{ vars.BASE_PATH }}/healthz" > /dev/null; then
                echo "healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 3
            done
            echo "app did not become healthy; check: pm2 logs recipe-generator"
            exit 1

  demo:
    # The static UI demo served from the portfolio site. Fixtures are
    # re-recorded here on every deploy (synthetic by construction — see
    # scripts/record-demo-fixtures.mjs), so the demo always shows the current
    # week instead of the week of the last push; the weekly schedule above
    # keeps it current between pushes. Still no database, no secrets beyond
    # the SSH four, nothing to restart — the recorder builds its own temp
    # database from migrations and seed. The committed fixtures file remains
    # as the recorder's checked-in example and for local demo work.
    name: Build and deploy the demo
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Record fresh fixtures
        run: node scripts/record-demo-fixtures.mjs

      - name: Build the demo
        run: npm run build:demo

      - name: Deploy the demo
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --delete is safe here precisely because nothing lives in this
          # directory except the previous build.
          switches: -az --delete --omit-dir-times --no-perms
          path: demo/.next-demo/
          remote_path: /var/www/recipe-generator-demo/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
          remote_port: 22

  image:
    # Builds on every deploy; pushes only when the PUBLISH_IMAGE repository
    # variable is "true". The push has failed with permission_denied since the
    # repository was recreated during the history rewrite — GHCR kept the old
    # package with an ACL this repository is not on, and no workflow
    # permission can fix a package-level ACL. Building without pushing keeps
    # the Dockerfile continuously verified instead of leaving the job red on
    # every deploy, which was teaching the workflow's red X to mean nothing.
    #
    # To publish again: delete the stale package (or grant this repo access)
    # under github.com → profile → Packages → recipe-generator → settings,
    # then set the repository variable PUBLISH_IMAGE=true.
    name: Build container image
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ vars.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
