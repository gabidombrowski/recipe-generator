name: Evals

# Costs money on every run, so it is scoped deliberately: only changes that can
# actually affect generation quality, plus a weekly run to catch drift in the
# model rather than in the code. Weekly, not nightly: at roughly $2-3 a run
# the nightly cadence bought thirty data points a month about a drift that
# does not move that fast.
on:
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "src/server/llm/**"
      - "src/lib/schemas.ts"
      # Renders the dietary rules into the prompt and carries the in-loop
      # checker — changes here move generation quality as surely as the
      # prompt files do, and one already shipped without triggering a run.
      - "src/lib/constraints.ts"
      - ".github/workflows/evals.yml"
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "evals/**"
      - "src/server/llm/**"
      - "src/lib/schemas.ts"
      - "src/lib/constraints.ts"
  schedule:
    # 07:00 UTC every Monday.
    - cron: "0 7 * * 1"
  # On-demand armed runs, e.g. right after a dependency migration rather
  # than waiting for Monday's cron.
  workflow_dispatch:
  workflow_dispatch:

concurrency:
  # Never two paid runs on the same ref at once.
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  evals:
    name: Generation evals
    runs-on: ubuntu-latest
    # Was sized for a fully sequential suite: 90 generations plus 90 judge
    # calls, one at a time. The runner now caps five in flight, so this is
    # headroom rather than a target.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite costs real money and cannot run without a key, so an unarmed
      # repository skips cleanly instead of failing. A nightly cron that is
      # red by default teaches everyone to ignore the workflow — which is the
      # opposite of what a drift check is for. Arming it is one action:
      # add ANTHROPIC_API_KEY as a repository secret.
      - name: Check whether the suite is armed
        id: armed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Evals skipped::ANTHROPIC_API_KEY is not set as a repository secret, so the paid suite did not run. Unit tests still cover everything that runs without a key."
          fi

      - name: Run evals
        if: steps.armed.outputs.armed == 'true'
        id: evals
        run: npm run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Convert report to Prometheus metrics
        if: always() && steps.armed.outputs.armed == 'true'
        run: npm run evals:metrics || true

      - name: Upload report
        if: always() && steps.armed.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            evals/reports/eval-report.json
            observability/eval-metrics/eval-metrics.prom
          retention-days: 30

      # A failing gate should be readable in the PR, not buried in a log.
      - name: Comment the summary on the PR
        if: always() && github.event_name == 'pull_request' && steps.armed.outputs.armed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/reports/eval-report.json';
            if (!fs.existsSync(path)) return;

            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const rows = r.assertions
              .map(a => `| ${a.meetsGate ? '✅' : '❌'} | \`${a.id}\` | ${(a.passRate * 100).toFixed(1)}% | ${(a.threshold * 100).toFixed(0)}% | ${a.gate} |`)
              .join('\n');

            const body = [
              `### Evals: ${r.passed ? 'pass' : 'fail'}`,
              '',
              `\`${r.model}\` · prompt \`${r.promptHashes.recipeGenerator}\` · ${r.totalRuns} generations · $${r.totalCostUsd.toFixed(4)}`,
              '',
              '| | Assertion | Pass rate | Gate | |',
              '|---|---|---|---|---|',
              rows,
              '',
              `**Red team:** ${r.redTeam.runs} runs, ${r.redTeam.hardGateFailures} hard-gate failure(s)`,
              `**Tier 2 (report only):** step coherence ${r.tier2.meanStepCoherence?.toFixed(2) ?? 'n/a'}/5 · seasoning boldness ${r.tier2.meanSeasoningBoldness?.toFixed(2) ?? 'n/a'}/5`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
