name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Hermetic and fast: no network, no API key, no database.
      - name: Type-check the Python tooling
        run: |
          python3 -m pip install --quiet mypy
          python3 -m mypy --strict tools/

      - name: Unit tests
        run: npm test

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          # Placeholder only: the smoke tests mint their own session cookie with
          # the same value, and nothing here reaches a deployed environment.
          AUTH_SECRET: ci-placeholder-secret
          DB_PATH: ./data/e2e.db

      - name: Smoke tests
        run: npm run test:e2e
        env:
          AUTH_SECRET: ci-placeholder-secret

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
