<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nutrition">
  <!--
    A plate, reduced until it still reads at 16px: filled square, ring, centre.
    Deliberately not a letterform — "N" at favicon size is indistinguishable
    from every other app whose name starts with N, and the plate motif is
    already the app's visual identity (see the `.plate` label style).
    Colours are the light-scheme --color-accent and --color-canvas as literals;
    an SVG served as a file cannot read the stylesheet's custom properties.
  -->
  <rect width="64" height="64" rx="14" fill="#136156" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="#fdfaf7" stroke-width="4" />
  <circle cx="32" cy="32" r="8" fill="#fdfaf7" />
</svg>
